[package]
name = "drivward-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "App de bandeja de Drivward"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
drivward-ipc = { path = "../../../crates/drivward-ipc" }

[profile.release]
lto = true
codegen-units = 1
strip = true
