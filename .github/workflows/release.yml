name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p drivward-portable -p drivward-service -p drivward-index
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalador de escritorio
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build
      - name: Paquete portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Drivward | Out-Null
          Copy-Item target/release/drivward-portable.exe, target/release/drivward-index.exe dist/Drivward/
          Copy-Item scripts/preparar-usb.ps1, library/fuentes.ejemplo.json, README.md, LICENSE dist/Drivward/
          Compress-Archive -Path dist/Drivward -DestinationPath dist/drivward-portable-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/drivward-portable-*.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
