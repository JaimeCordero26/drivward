[package]
name = "drivward-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
walkdir = "2"

[dev-dependencies]
ed25519-dalek = "3.0.0"
tempfile = "3"
