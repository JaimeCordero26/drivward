[package]
name = "drivward-portable"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drivward-core = { version = "0.1.0", path = "../drivward-core" }
drivward-platform = { version = "0.1.0", path = "../drivward-platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"

[target."cfg(windows)".dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["list-view", "notice", "progress-bar", "textbox", "high-dpi"] }

[build-dependencies]
embed-manifest = "1.5.1"

[dev-dependencies]
tempfile = "3.27.0"
